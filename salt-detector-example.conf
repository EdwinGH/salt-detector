// salt-detector-example.conf — configuration for the salt:detector monitor
//
// JSON5 syntax (comments and trailing commas allowed) despite the .conf name.
// Copy to salt-detector.conf and edit. Keep the real file out of git:
//   echo 'salt-detector.conf' >> .gitignore
//
// Keys are quoted so the file still parses without a json5 library installed
// (both scripts fall back to stripping comments and trailing commas).
{
  "mqtt": {
    "host": "127.0.0.1",
    "port": 1883,
    // The device id is its MAC with colons removed, grouped in fours.
    // Read it off the device/provisioning message, or run --info.
    "device_id": "e0e2-e66c-xxxx",
    // Seconds to wait for a reply to a telemetry request.
    "timeout": 15,
    // Only needed if your broker requires authentication. Note the device
    // itself always presents think_water_broker / th1nk_w4t3r_p4ss0rd,
    // hardcoded in firmware, so that account must exist if you enable auth.
    "username": null,
    "password": null,
  },

  "sensor": {
    // Calibration in millimetres. MEASURE THESE IN PLACE, with the sensor
    // mounted where it will live — desk readings are useless.
    // Run: ./salt-detector-daemon.py --calibrate
    //
    //   full_mm  — distance reported with the container full
    //   empty_mm — distance at the point you want to call 0%
    //
    // empty_mm should be your REFILL POINT, not the bare bottom of the tin.
    // Salt below the brine water level stops contributing to softening, so
    // that water line is the sensible zero: 0% then means "refill now" rather
    // than "the tin is empty". Note the date and mounting position here —
    // if the sensor is ever moved or re-seated, both figures must be redone
    // and nothing in the software can detect the drift.
    "full_mm": 100,
    "empty_mm": 374,

    // Readings outside this window are discarded. The VL53-class ToF sensor
    // cannot resolve closer than ~50 mm, and daylight defeats it past
    // ~500 mm. A reading of 0 means "no valid target" and is never stored.
    "min_valid_mm": 40,
    "max_valid_mm": 700,

    // Consecutive readings vary by tens of mm, so take several and use the
    // median. The raw samples are stored alongside for later inspection.
    "samples": 5,
    "sample_gap": 3,
  },

  "daemon": {
    // Seconds between measurement runs. 3600 = hourly.
    "interval": 3600,
    // The device clock resets to 1970 on every reboot, so push the current
    // time before each run. Its reply timestamps are then meaningful.
    "set_clock": true,
    // Seconds to wait before the first run, so the network settles at boot.
    "startup_delay": 30,
  },

  "database": {
    "host": "localhost",
    "port": 3306,
    "user": "saltdetector",
    "password": "CHANGEME",
    "database": "sensors",
    "readings_table": "salt_readings",
    "alerts_table": "salt_alerts",
  },

  "alert": {
    // Email when the level falls below this percentage. If empty_mm is set to
    // the refill point (as recommended), 0% already means "act now" — so keep
    // this well above zero to get useful warning time. Tune it once the
    // database shows your real consumption rate; the alert email reports
    // mm/day and an estimate of days remaining.
    "threshold_percent": 25,
    // Do not send another alert within this many hours.
    "cooldown_hours": 48,
    // Ignore readings older than this — if the daemon has died, say so
    // rather than alerting on stale data.
    "max_reading_age_hours": 26,
    // Also email when no fresh reading exists (daemon down, device offline).
    "alert_on_stale": true,

    "mail": {
      "to": "you@example.com",
      "from": "salt-detector@example.com",
      "subject": "Salt level low — water softener needs refilling",
      // Leave smtp_host null to pipe through the local sendmail binary.
      "smtp_host": null,
      "smtp_port": 25,
      "smtp_tls": false,
      "smtp_user": null,
      "smtp_password": null,
    },
  },
}
