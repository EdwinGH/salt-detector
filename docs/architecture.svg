<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowDead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="#ffffff"/>

  <!-- ============ ORIGINAL ============ -->
  <text x="40" y="38" font-size="17" font-weight="700" fill="#0f172a">Original architecture — no longer works</text>

  <rect x="40" y="58" width="800" height="222" rx="10" fill="#fafafa" stroke="#e2e8f0"/>

  <!-- device -->
  <rect x="66" y="90" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="141" y="115" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">salt:detector</text>
  <text x="141" y="133" font-size="11" text-anchor="middle" fill="#64748b">ESP32 + ToF laser</text>

  <!-- mqtt broker (vendor) -->
  <rect x="300" y="90" width="190" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="395" y="112" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7f1d1d">iot.thinkwater.com:30103</text>
  <text x="395" y="130" font-size="11" text-anchor="middle" fill="#b91c1c">MQTT ingress — retired</text>

  <!-- backend -->
  <rect x="575" y="90" width="180" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="665" y="112" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7f1d1d">vendor backend</text>
  <text x="665" y="130" font-size="11" text-anchor="middle" fill="#b91c1c">held the provisioning reply</text>

  <!-- app -->
  <rect x="300" y="196" width="190" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="395" y="218" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">Android app</text>
  <text x="395" y="236" font-size="11" text-anchor="middle" fill="#64748b">subscribes only — never publishes</text>

  <!-- rest api -->
  <rect x="575" y="196" width="180" height="56" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="665" y="218" font-size="12" font-weight="600" text-anchor="middle" fill="#134e4a">cloud.thinkwater.com</text>
  <text x="665" y="236" font-size="11" text-anchor="middle" fill="#0f766e">REST API — still alive</text>

  <!-- links -->
  <line x1="216" y1="120" x2="296" y2="120" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrowDead)" marker-start="url(#arrowDead)"/>
  <text x="256" y="112" font-size="10" text-anchor="middle" fill="#b91c1c">MQTT/TLS</text>

  <line x1="490" y1="120" x2="571" y2="120" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrowDead)" marker-start="url(#arrowDead)"/>

  <line x1="395" y1="192" x2="395" y2="154" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="405" y="176" font-size="10" fill="#64748b">subscribe</text>

  <line x1="490" y1="224" x2="571" y2="224" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrowLive)" marker-start="url(#arrowLive)"/>
  <text x="530" y="216" font-size="10" text-anchor="middle" fill="#0f766e">REST</text>

  <line x1="665" y1="192" x2="665" y2="154" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- ============ REPLACEMENT ============ -->
  <text x="40" y="332" font-size="17" font-weight="700" fill="#0f172a">This project — local replacement</text>

  <rect x="40" y="352" width="800" height="238" rx="10" fill="#f8fdfc" stroke="#ccfbf1"/>

  <!-- device -->
  <rect x="66" y="392" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="141" y="417" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">salt:detector</text>
  <text x="141" y="435" font-size="11" text-anchor="middle" fill="#64748b">unmodified firmware</text>

  <!-- dns -->
  <rect x="278" y="368" width="150" height="48" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="353" y="387" font-size="12" font-weight="600" text-anchor="middle" fill="#134e4a">dnsmasq override</text>
  <text x="353" y="404" font-size="10" text-anchor="middle" fill="#0f766e">iot.thinkwater.com → LAN</text>

  <!-- mosquitto -->
  <rect x="278" y="432" width="150" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="353" y="454" font-size="12.5" font-weight="600" text-anchor="middle" fill="#134e4a">mosquitto</text>
  <text x="353" y="472" font-size="10.5" text-anchor="middle" fill="#0f766e">TLS :30103 · plain :1883</text>

  <!-- daemon -->
  <rect x="490" y="424" width="165" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="572" y="446" font-size="12.5" font-weight="600" text-anchor="middle" fill="#134e4a">daemon</text>
  <text x="572" y="464" font-size="10.5" text-anchor="middle" fill="#0f766e">polls, medians, stores</text>

  <!-- mysql -->
  <rect x="700" y="424" width="120" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="760" y="446" font-size="12.5" font-weight="600" text-anchor="middle" fill="#134e4a">MySQL</text>
  <text x="760" y="464" font-size="10.5" text-anchor="middle" fill="#0f766e">reading history</text>

  <!-- alert -->
  <rect x="700" y="516" width="120" height="52" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="760" y="537" font-size="12.5" font-weight="600" text-anchor="middle" fill="#134e4a">alert (cron)</text>
  <text x="760" y="554" font-size="10.5" text-anchor="middle" fill="#0f766e">email when low</text>

  <!-- links -->
  <path d="M 216 415 L 250 415 L 250 392 L 274 392" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowLive)"/>
  <text x="243" y="382" font-size="10" text-anchor="middle" fill="#0f766e">DNS</text>

  <path d="M 216 430 L 250 430 L 250 461 L 274 461" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrowLive)" marker-start="url(#arrowLive)"/>
  <text x="245" y="500" font-size="10" text-anchor="middle" fill="#0f766e">MQTT/TLS</text>

  <line x1="428" y1="458" x2="486" y2="455" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrowLive)" marker-start="url(#arrowLive)"/>
  <line x1="655" y1="453" x2="696" y2="453" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrowLive)"/>
  <path d="M 760 486 L 760 512" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrowLive)"/>

  <text x="66" y="512" font-size="11" fill="#475569">The device's endpoint is compiled into its firmware, so it is redirected</text>
  <text x="66" y="530" font-size="11" fill="#475569">by DNS rather than reconfigured. It accepts a self-signed certificate.</text>
  <text x="66" y="556" font-size="11" fill="#475569">Readings, commands and timekeeping all work. Provisioning never</text>
  <text x="66" y="574" font-size="11" fill="#475569">completes — the reply came from the retired backend — so the LEDs blink.</text>
</svg>
